version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cyberspace_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: a1236987450
      POSTGRES_DB: cyberspace_monitoring
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberspace_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=cyberspace_monitoring
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=a1236987450
      - JWT_SECRET=cyberspace-dashboard-jwt-secret-key-2024
      - JWT_EXPIRES_IN=3d
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
